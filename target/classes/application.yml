spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/data/tuoicaydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
      path: /h2-console

server:
  port: 8080

# JWT Configuration
jwt:
  secret: tuoicay-secret-key-2024-change-in-production-environment-v2
  access-token-expiration: 3600000    # 1 giờ
  refresh-token-expiration: 604800000 # 7 ngày

# MQTT Configuration
mqtt:
  broker-url: tcp://localhost:1883
  client-id: backend_tuoicay
  username: ${MQTT_USER:tuoicay}
  password: ${MQTT_PASS:tuoicay123}
  topic:
    telemetry: user/+/iot/+/telemetry
    status: user/+/iot/+/status
    command: user/{username}/iot/{macId}/command
    config: user/{username}/iot/{macId}/config
    ack: user/+/iot/+/ack

# Telegram Bot (cảnh báo)
telegram:
  bot-token: ${BOT_TOKEN:}   # Token từ BotFather
  chat-id: ${CHAT_ID:}       # Chat ID người nhận

# Logging
logging:
  level:
    com.smartgardenmini: DEBUG
    org.springframework.security: WARN
    org.springframework.integration: INFO