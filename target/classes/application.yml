spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/data/tuoicaydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080

---

logging: # Thêm khối này vào đây
  level:
    org:
      springframework:
        security: DEBUG
        web:
          filter:
            OncePerRequestFilter: DEBUG
    com:
      andeptrai:
        iot:
          jwtS: DEBUG
